<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B32">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<title>Workout</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231E2B32'/%3E%3Crect x='6' y='29' width='52' height='6' rx='3' fill='%23FAFBFA'/%3E%3Crect x='12' y='14' width='8' height='36' rx='2' fill='%232C4FA3'/%3E%3Crect x='44' y='14' width='8' height='36' rx='2' fill='%232C4FA3'/%3E%3Crect x='22' y='20' width='5' height='24' rx='2' fill='%23F1C644'/%3E%3Crect x='37' y='20' width='5' height='24' rx='2' fill='%23F1C644'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --zinc:#E4E7E5;      /* page */
  --paper:#FAFBFA;     /* panels */
  --well:#EEF1EF;      /* input wells */
  --ink:#1E2B32;       /* text, primary actions */
  --steel:#56646B;     /* secondary text */
  --rule:#C6CDCA;      /* hairlines */
  --home:#2E6B57;      /* home location */
  --gym:#2C4FA3;       /* gym location */
  --chalk:#F1C644;     /* completed sets */
  --alert:#A8323A;     /* destructive */
  --loc:var(--home);
  --display:"Big Shoulders Display","Big Shoulders","Arial Narrow","Roboto Condensed","Helvetica Neue Condensed",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:64px;
}
body[data-loc="gym"]{--loc:var(--gym)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--zinc);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1;margin:0;letter-spacing:.01em}
p{margin:0}

/* ---------- Lock screen ---------- */
.lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.lock h1{font-size:36px}
.lock .hint{color:var(--steel);min-height:24px;text-align:center}
.lock .hint.bad{color:var(--alert)}
.barbell{width:min(320px,86vw);height:auto;overflow:visible}
.barbell .rig{transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.lock.lifted .rig{transform:translateY(-26px)}
.lock.shake .rig{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.plate{fill:transparent;stroke:var(--rule);stroke-width:2;stroke-dasharray:5 4;transform-box:fill-box;transform-origin:center;transition:fill .15s,stroke .15s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.plate.on{stroke:none;transform:scale(1)}
.plate.big.on{fill:var(--gym)}
.plate.small.on{fill:var(--home)}
.plate:not(.on){transform:scale(.92)}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.key{height:64px;border:1px solid var(--rule);background:var(--paper);border-radius:6px;font-family:var(--display);font-weight:800;font-size:32px}
.key:active{background:var(--ink);color:var(--paper)}
.key.fn{font-family:var(--body);font-size:15px;font-weight:700;color:var(--steel);background:transparent;border-color:transparent}

/* ---------- App frame ---------- */
.top{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:0 auto;padding:16px 16px 8px}
.mark{font-family:var(--display);font-weight:800;font-size:24px}
.mark span{color:var(--loc)}
.linkbtn{background:none;border:0;padding:8px 4px;color:var(--steel);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
main{max-width:760px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{height:var(--nav-h);background:none;border:0;border-top:3px solid transparent;color:#A9B8BE;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em}
.nav button[aria-current="page"]{color:var(--paper);border-top-color:var(--chalk)}

/* ---------- Day strip ---------- */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 20px}
.days button{position:relative;background:transparent;border:1px solid var(--rule);border-radius:4px;padding:8px 0 10px;font-family:var(--display);font-weight:800;font-size:18px;color:var(--steel)}
.days button.today{color:var(--ink);border-color:var(--ink)}
.days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.days button .logged{position:absolute;left:50%;bottom:4px;width:14px;height:3px;margin-left:-7px;background:var(--chalk);border-radius:2px}

/* ---------- Day hero ---------- */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 16px;margin-bottom:18px}
.hero > div:first-child{min-width:0}
.hero .dayname{font-size:clamp(44px,13vw,60px);line-height:.9}
.hero .ptitle{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--loc);margin-top:6px}
.hero .focus{flex-basis:100%;color:var(--steel);max-width:60ch}
.hero .draftnote{flex-basis:100%;font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.hero .draftnote::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--chalk);box-shadow:0 0 0 2px var(--ink)}

.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;padding:2px;background:var(--paper)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:6px 18px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2}
.seg input:checked + span.home{background:var(--home);color:var(--paper)}
.seg input:checked + span.gym{background:var(--gym);color:var(--paper)}
.seg input:focus-visible + span{outline:3px solid var(--chalk);outline-offset:1px}

/* ---------- Exercise log ---------- */
.log{background:var(--paper);border-top:4px solid var(--loc)}
.ex{display:grid;grid-template-columns:44px 1fr;gap:0 12px;padding:18px 16px 16px 10px;border-bottom:1px solid var(--rule)}
.ex:last-child{border-bottom:0}
.ex-num{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;color:var(--loc);text-align:right;position:relative}
.ex.grp .ex-num::after{content:"";position:absolute;right:-7px;top:44px;bottom:-40px;width:3px;background:var(--loc);opacity:.35;border-radius:2px}
.ex.grp-end .ex-num::after{display:none}
.ex-grp{font-size:13px;font-weight:700;color:var(--loc);margin-bottom:4px}
.ex-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.ex-head h3{flex:1 1 14ch}
.ex h3{font-size:24px;line-height:1.05}
.target{font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap}
.equip{color:var(--steel);font-size:14px;margin-top:4px}
.note{font-size:14px;margin-top:6px;max-width:62ch}
.last{font-size:14px;margin-top:8px;padding:6px 10px;background:var(--well);border-left:3px solid var(--steel);max-width:62ch}
.last b{font-weight:700}
.sets{margin-top:12px;display:grid;gap:8px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 52px;gap:8px;align-items:center;border-radius:6px;padding:2px;transition:background .25s}
.set.done{background:color-mix(in srgb,var(--chalk) 32%,transparent)}
.set-n{font-family:var(--display);font-weight:800;font-size:18px;color:var(--steel);text-align:center}
.set-head{font-size:12px;font-weight:700;color:var(--steel);line-height:1.2;padding-top:0;padding-bottom:0}
.set-head span:first-child,.set-head span:last-child{text-align:center}
.set-head span:nth-child(2),.set-head span:nth-child(3){padding-left:4px}
.fld{display:flex;align-items:center;background:var(--well);border:1px solid var(--rule);border-radius:6px;height:52px}
.fld:focus-within{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.fld input{width:100%;min-width:0;height:100%;border:0;background:transparent;padding:0 10px;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fld input::placeholder{color:#97A4A9;font-weight:600;font-size:20px}
.tick{height:52px;border:2px solid var(--ink);border-radius:6px;background:var(--paper);font-size:22px;font-weight:700;line-height:1}
.tick[aria-pressed="true"]{background:var(--chalk);border-color:#B8901C}
.ex-acts{display:flex;gap:16px;margin-top:10px}
.learn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:7px 14px 7px 10px;border:2px solid var(--loc);border-radius:999px;background:transparent;color:var(--loc);font-weight:700;font-size:14px;line-height:1.2}
.learn::before{content:"";border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.learn:hover{background:color-mix(in srgb,var(--loc) 10%,transparent)}

/* ---------- Learn more sheet ---------- */
html.sheet-open{overflow:hidden}
.sheet{border:0;padding:0;width:min(760px,100vw);max-width:100vw;max-height:94vh;max-height:94dvh;margin:auto auto 0;border-radius:12px 12px 0 0;background:var(--paper);color:var(--ink);overflow:auto;overscroll-behavior:contain}
.sheet::backdrop{background:rgba(30,43,50,.6)}
.sheet[open]{animation:sheetIn .22s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetIn{from{transform:translateY(24px);opacity:0}}
.sheet-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 16px 12px;background:var(--paper);border-bottom:4px solid var(--loc)}
.sheet-head h2{font-size:30px;line-height:1.05}
.sheet-sub{font-size:14px;color:var(--steel);margin-top:4px}
.sheet-close{flex:none;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:8px 14px;font-weight:700;font-size:15px}
.sheet-body{padding:16px 16px 24px}
.video{position:relative;aspect-ratio:16 / 9;background:var(--ink);border-radius:8px;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .novideo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;color:var(--paper)}
.video .novideo a{color:var(--chalk);font-weight:700}
.vcredit{font-size:13px;color:var(--steel);margin-top:6px}
.vcredit a{color:var(--steel)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.shots figure{margin:0}
.shots img{display:block;width:100%;aspect-ratio:4 / 3;object-fit:contain;background:var(--well);border-radius:8px}
.shots figcaption{font-size:13px;font-weight:700;color:var(--steel);margin-top:4px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:18px 0 0;font-size:15px}
.facts dt{font-weight:700;color:var(--steel)}
.facts dd{margin:0}
@media (min-width:640px){.sheet{margin:auto;border-radius:12px}}
.small{background:none;border:0;padding:6px 0;font-weight:700;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.small.danger{color:var(--alert)}
.tip{font-size:13px;color:var(--steel);margin:10px 0 0}

/* ---------- Panels & forms ---------- */
.panel{background:var(--paper);padding:20px 16px;margin-top:20px}
.panel h2{font-size:28px;margin-bottom:14px}
.panel h2 + p{color:var(--steel);margin:-6px 0 14px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.f input,.f select,.f textarea{font-weight:400;font-size:16px;background:var(--well);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;min-height:46px;width:100%}
.f textarea{min-height:84px;resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.f .u{font-weight:400;color:var(--steel)}
.full{grid-column:1 / -1}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-size:14px;font-weight:700;padding:0;margin-bottom:6px}
.energy{display:flex;flex-wrap:wrap;gap:6px}
.energy label{position:relative}
.energy input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.energy span{display:block;padding:8px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--well);font-size:14px;font-weight:700}
.energy input:checked + span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.energy input:focus-visible + span{outline:3px solid var(--chalk);outline-offset:1px}
.timer{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.timer .tv{font-family:var(--display);font-weight:800;font-size:26px;line-height:46px}
.timer .row{display:flex;align-items:center;gap:12px;min-height:46px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}
.btn{background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:10px 22px;min-height:50px;font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--alert);border-color:var(--alert)}
.btn.slim{min-height:42px;font-size:19px;padding:8px 16px}

/* ---------- Pages ---------- */
.pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 0 4px}
.pagehead h1{font-size:52px}
.lede{color:var(--steel);max-width:62ch;margin-bottom:8px}
.stats{display:flex;flex-wrap:wrap;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:16px}
.stat{flex:1 1 150px;background:var(--paper);padding:14px 16px}
.stat .v{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.stat .v small{font-size:18px;color:var(--steel);margin-left:3px}
.stat .k{font-size:14px;color:var(--steel);margin-top:4px}
.delta{font-size:14px;font-weight:700;margin-top:2px}
.empty{padding:24px 16px;background:var(--paper);color:var(--steel);margin-top:16px}

/* history */
.sess{background:var(--paper);border-left:4px solid var(--home);margin-top:10px}
.sess.gym{border-left-color:var(--gym)}
.sess summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:76px 1fr auto;gap:4px 12px;align-items:center}
.sess summary::-webkit-details-marker{display:none}
.sess .d{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05}
.sess .d small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--steel)}
.sess .t{font-weight:700}
.sess .m{font-size:14px;color:var(--steel)}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;color:var(--paper);background:var(--home)}
.tag.gym{background:var(--gym)}
.sess-body{padding:0 16px 16px 104px}
.sess-body ul{list-style:none;margin:0;padding:0}
.sess-body li{padding:8px 0;border-top:1px solid var(--rule)}
.sess-body li b{display:block}
.sess-body .snote{margin-top:10px;padding:8px 10px;background:var(--well);font-size:14px;white-space:pre-wrap}
.month{font-family:var(--display);font-weight:800;font-size:22px;margin:26px 0 0;color:var(--steel)}

table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:700;color:var(--steel);background:var(--paper);position:sticky;top:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
td .small{padding:0}

/* plan editor */
.ped{border-top:1px solid var(--rule);padding:16px 0}
.ped:first-of-type{border-top:0}
.ped-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ped-top .n{font-family:var(--display);font-weight:800;font-size:28px;color:var(--loc);width:30px}
.ped-top .f{flex:1}
.ped .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.ped-acts{display:flex;gap:18px;margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;font-weight:700;font-size:15px;z-index:20;box-shadow:0 0 0 2px var(--chalk);max-width:calc(100vw - 32px)}

@media (min-width:640px){
  .hero .dayname{font-size:76px}
  .ex{grid-template-columns:56px 1fr;padding-left:14px}
  .set{grid-template-columns:28px minmax(0,190px) minmax(0,190px) 60px}
}
@media (max-width:380px){
  .keypad{grid-template-columns:repeat(3,68px)}
  .days button{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body data-loc="home">

<noscript><p style="padding:24px">This app needs JavaScript turned on.</p></noscript>

<!-- PIN gate -->
<div id="lock" class="lock" hidden>
  <svg class="barbell" viewBox="0 0 320 130" aria-hidden="true">
    <g class="rig">
      <rect x="6" y="61" width="308" height="8" rx="4" fill="#1E2B32"/>
      <rect x="104" y="60" width="112" height="10" rx="3" fill="#56646B"/>
      <rect class="plate small" data-slot="2" x="58" y="30" width="18" height="70" rx="4"/>
      <rect class="plate big"   data-slot="0" x="80" y="10" width="20" height="110" rx="4"/>
      <rect class="plate big"   data-slot="1" x="220" y="10" width="20" height="110" rx="4"/>
      <rect class="plate small" data-slot="3" x="244" y="30" width="18" height="70" rx="4"/>
    </g>
  </svg>
  <h1 id="pinTitle">Enter your PIN</h1>
  <p id="pinMsg" class="hint" role="status" aria-live="polite">Four digits loads the bar.</p>
  <div class="keypad" role="group" aria-labelledby="pinTitle">
    <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    <span></span><button class="key" data-k="0">0</button><button class="key fn" data-k="back" aria-label="Delete last digit">Delete</button>
  </div>
</div>

<!-- App -->
<div id="app" hidden>
  <header class="top">
    <div class="mark">Workout<span>.</span></div>
    <button class="linkbtn" data-act="lock">Lock</button>
  </header>
  <main id="main"></main>
  <nav class="nav" aria-label="Sections">
    <div class="nav-in">
      <button data-tab="train">Train</button>
      <button data-tab="history">History</button>
      <button data-tab="body">Body</button>
      <button data-tab="plan">Plan</button>
      <button data-tab="settings">Settings</button>
    </div>
  </nav>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>
<dialog id="learn" class="sheet" aria-labelledby="learnTitle">
  <div class="sheet-head">
    <div><h2 id="learnTitle"></h2><p class="sheet-sub" id="learnSub"></p></div>
    <button class="sheet-close" data-act="learn-close">Close</button>
  </div>
  <div class="sheet-body" id="learnBody"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
'use strict';

/* =====================================================================
   PIN
   The PIN is stored as a SHA-256 hash so it isn't readable at a glance.

/* =====================================================================
   SHA-256 (small pure-JS version so the PIN check also works from file://)
   ===================================================================== */
function sha256(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  const maxWord = Math.pow(2, 32);
  let result = '';
  const words = [];
  const bitLen = ascii.length * 8;
  let hash = [], k = [];
  const isComposite = {};
  for (let c = 2, n = 0; n < 64; c++) {
    if (!isComposite[c]) {
      for (let i = 0; i < 313; i += c) isComposite[i] = c;
      hash[n] = (Math.pow(c, 0.5) * maxWord) | 0;
      k[n++] = (Math.pow(c, 1 / 3) * maxWord) | 0;
    }
  }
  hash = hash.slice(0, 8);
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = (bitLen / maxWord) | 0;
  words[words.length] = bitLen;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const old = hash;
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] +
        (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash);
      hash[4] = (hash[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  for (let i = 0; i < 8; i++) {
    for (let j = 3; j + 1; j--) {
      const b = (hash[i] >> (j * 8)) & 255;
      result += (b < 16 ? '0' : '') + b.toString(16);
    }
  }
  return result;
}

        exercises: p.exercises.map(a => ({
          id: uid(), name: a[0], sets: a[1], reps: a[2], equip: a[3] || '',
          notes: a[4] || '', group: a[5] || '', type: a[6] || 'reps'

}
function defaultState() {
  return {

    profile: { height: '', goal: '', notes: '' },
    plan: buildPlan(DEFAULT_PLAN),
    sessions: [],
    body: [],
    drafts: {}

}
function migrate(raw) {

  s.settings = Object.assign({}, base.settings, s.settings || {});
  s.profile = Object.assign({}, base.profile, s.profile || {});
  s.sessions = Array.isArray(s.sessions) ? s.sessions : [];
  s.body = Array.isArray(s.body) ? s.body : [];
  s.drafts = s.drafts && typeof s.drafts === 'object' ? s.drafts : {};
  s.plan = s.plan && typeof s.plan === 'object' ? s.plan : base.plan;
  DAYS.forEach(d => {
    s.plan[d.id] = s.plan[d.id] || base.plan[d.id];
    Object.keys(LOCS).forEach(loc => {
      const p = s.plan[d.id][loc] || base.plan[d.id][loc];
      p.exercises = Array.isArray(p.exercises) ? p.exercises : [];
      p.exercises.forEach(x => { if (!x.id) x.id = uid(); if (!x.type) x.type = 'reps'; });

function rerenderEx(id) {
  const block = $(`[data-exblock="${id}"]`);
  const list = curPlan().exercises;
  const i = list.findIndex(x => x.id === id);
  if (!block || i < 0) return render();

}
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');

  clearTimeout(toastTimer);

/* =====================================================================
   Actions
   ===================================================================== */
const acts = {
  day(b) {
    if (b.dataset.scope === 'plan') ui.planDay = b.dataset.day; else ui.day = b.dataset.day;
    render(); window.scrollTo(0, 0);
  },
  tick(b) {
    const row = b.closest('.set');
    const ex = exById(row.dataset.ex); if (!ex) return;
    const arr = ensureSets(ex);
    const s = arr[Number(row.dataset.i)];
    if (!s.done) {
      const wIn = $('[data-f="w"]', row), rIn = $('[data-f="r"]', row);
      if (s.w === '' && wIn.placeholder && wIn.placeholder !== 'BW' && !isNaN(Number(wIn.placeholder))) s.w = wIn.placeholder;
      if (s.r === '' && rIn.placeholder && /^\d+(\.\d+)?$/.test(rIn.placeholder) && lastFor(ex.name)) s.r = rIn.placeholder;
      wIn.value = s.w; rIn.value = s.r;
    }
    s.done = !s.done;
    row.classList.toggle('done', s.done);
    b.setAttribute('aria-pressed', String(s.done));
    persist();
    refreshDraftNote();
  },
  'add-set'(b) {
    const ex = exById(b.dataset.ex); if (!ex) return;
    const arr = ensureSets(ex);
    const prev = arr[arr.length - 1];
    arr.push({ w: prev ? prev.w : '', r: '', done: false });
    persist(); rerenderEx(ex.id);
  },
  'del-set'(b) {
    const ex = exById(b.dataset.ex); if (!ex) return;
    const arr = ensureSets(ex);
    if (arr.length > 1) arr.pop();
    persist(); rerenderEx(ex.id);
  },
  'timer-start'() { const d = draft(true); d.startedAt = Date.now(); persist(); render(); },
  'timer-reset'() { const d = draft(true); d.startedAt = null; persist(); render(); },
  'save-session'() {
    const d = draft(false);
    const p = curPlan();
    const exercises = [];
    p.exercises.forEach(ex => {
      const arr = d && d.sets[ex.id];
      if (!arr) return;
      const sets = arr.filter(s => s.w !== '' || s.r !== '' || s.done).map(s => ({ w: num(s.w), r: num(s.r) }));
      if (sets.length) exercises.push({ name: ex.name, type: ex.type, equip: ex.equip, sets });
    });
    if (!exercises.length && !(d && d.notes)) { toast('Log at least one set or add a note before saving.'); return; }
    let duration = num(d.duration);
    if (duration == null && d.startedAt) duration = Math.max(1, Math.round((Date.now() - d.startedAt) / 60000));
    const session = {
      id: uid(), date: d.date || todayISO(), dayId: ui.day, loc: ui.loc, title: p.title,
      duration, energy: num(d.energy), bodyweight: num(d.bodyweight), notes: d.notes || '',
      exercises, createdAt: new Date().toISOString()
    };
    S.sessions.push(session);
    if (session.bodyweight != null) {
      const ex = S.body.find(e => e.date === session.date);
      if (ex) { if (ex.weight == null) ex.weight = session.bodyweight; }
      else S.body.push({ id: uid(), date: session.date, weight: session.bodyweight, notes: '' });
    }
    delete S.drafts[dKey()];
    persist(true); render(); window.scrollTo(0, 0);
    toast('Session saved' + (session.bodyweight != null ? ', body weight added to Body' : ''));
  },
  discard() {
    if (!draftHasData(draft(false))) { toast('Nothing to discard.'); return; }
    if (!confirm('Discard this unsaved session? Logged sets will be cleared.')) return;
    delete S.drafts[dKey()]; persist(true); render(); toast('Session discarded');
  },
  'del-session'(b) {
    if (!confirm('Delete this session? This can’t be undone.')) return;
    S.sessions = S.sessions.filter(s => s.id !== b.dataset.id); persist(true); render(); toast('Session deleted');
  },
  'del-body'(b) {
    if (!confirm('Delete this body entry?')) return;
    S.body = S.body.filter(e => e.id !== b.dataset.id); persist(true); render(); toast('Entry deleted');
  },
  'ex-add'() {
    const p = S.plan[ui.planDay][ui.planLoc];
    p.exercises.push({ id: uid(), name: 'New exercise', sets: 3, reps: '10', equip: '', notes: '', group: '', type: 'reps' });
    persist(); render();
    const last = $$('.ped').pop(); if (last) { const i = $('[data-pe="name"]', last); i.focus(); i.select(); }
  },
  'ex-up'(b) { movePlanEx(b, -1); },
  'ex-down'(b) { movePlanEx(b, 1); },
  'ex-del'(b) {
    const id = b.closest('.ped').dataset.exid;
    const p = S.plan[ui.planDay][ui.planLoc];
    const x = p.exercises.find(e => e.id === id);
    if (!confirm(`Delete “${x ? x.name : 'this exercise'}” from the plan? Past logs stay in History.`)) return;
    p.exercises = p.exercises.filter(e => e.id !== id); persist(); render();
  },
  'copy-plan'() {
    const other = ui.planLoc === 'home' ? 'gym' : 'home';
    if (!confirm(`Replace the ${LOCS[other].toLowerCase()} plan for ${dayName(ui.planDay)} with a copy of this one?`)) return;
    const copy = clone(S.plan[ui.planDay][ui.planLoc]);
    copy.exercises.forEach(x => { x.id = uid(); });
    S.plan[ui.planDay][other] = copy;
    delete S.drafts[ui.planDay + '-' + other];
    persist(true); toast(`Copied to ${LOCS[other]}`);
  },
  export() {
    const blob = new Blob([JSON.stringify(Object.assign({ exportedAt: new Date().toISOString() }, S), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `workout-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Backup exported');
  },
  import() { $('#importFile').click(); },
  'reset-plan'() {
    if (!confirm('Replace your plan with the default plan? Sessions and body entries stay. Any unsaved session in progress is cleared.')) return;
    S.plan = buildPlan(DEFAULT_PLAN); S.drafts = {}; persist(true); render(); toast('Plan reset to default');
  },
  erase() {
    if (!confirm('Erase all sessions, body entries and plan edits on this device? This can’t be undone. Export a backup first if you might need it.')) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
    S = defaultState(); persist(true); render(); toast('All data erased');
  },
  learn(b) { openLearn(b); },
  'copy-draft'() {
    const d = draft(false) || {};
    const p = curPlan();
    const exercises = p.exercises.map(ex => {
      const arr = (d.sets && d.sets[ex.id]) || [];
      return { name: ex.name, type: ex.type, equip: ex.equip, sets: arr.filter(x => x.w !== '' || x.r !== '' || x.done).map(x => ({ w: num(x.w), r: num(x.r) })) };
    });
    let duration = num(d.duration);
    if (duration == null && d.startedAt) duration = Math.round((Date.now() - d.startedAt) / 60000);
    copyText(buildPrompt({ date: d.date || todayISO(), dayId: ui.day, loc: ui.loc, title: p.title, duration, energy: num(d.energy), bodyweight: num(d.bodyweight), notes: d.notes || '', exercises }, p));
  },
  'copy-session'(b) {
    const s = S.sessions.find(x => x.id === b.dataset.id); if (!s) return;
    copyText(buildPrompt(s, S.plan[s.dayId] && S.plan[s.dayId][s.loc]));
  },
  'learn-close'() { closeLearn(); },
  lock() { persist(true); try { sessionStorage.removeItem(UNLOCK_KEY); } catch (e) { /* ignore */ } showLock(); }
};
function movePlanEx(b, dir) {
  const id = b.closest('.ped').dataset.exid;
  const list = S.plan[ui.planDay][ui.planLoc].exercises;
  const i = list.findIndex(e => e.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  persist(); render();
  const btn = $(`.ped[data-exid="${id}"] [data-act="${dir < 0 ? 'ex-up' : 'ex-down'}"]`) || $(`.ped[data-exid="${id}"] [data-pe="name"]`);
  if (btn) btn.focus();
}
function refreshDraftNote() {
  if (ui.tab !== 'train') return;
  const has = draftHasData(draft(false));
  const note = $('.hero .draftnote');
  if (has && !note) {
    const p = document.createElement('p'); p.className = 'draftnote';
    p.textContent = 'Session in progress. It’s kept on this device until you save or discard it.';
    $('.hero').appendChild(p);
  } else if (!has && note) note.remove();
}

/* =====================================================================
   Copy for Claude
   ===================================================================== */
function buildPrompt(sess, plan) {
  const W = wU(), L = lU(), out = [];
  const line = t => out.push(t);
  line(`I'm sharing a workout session from my training log. Please review it and help me improve my body composition and strength toward my goals.`);
  line('');
  line('## About me');
  if (S.profile.height) line(`- Height: ${S.profile.height} ${L}`);
  const lw = latestVal('weight');
  if (lw) line(`- Latest body weight: ${fmtN(lw.v)} ${W} (${fmtDate(lw.date, true)})`);
  const fw = firstVal('weight');
  if (lw && fw && fw.date !== lw.date) line(`- Body weight change since ${fmtDate(fw.date, true)}: ${deltaTxt(lw.v, fw.v, W)}`);
  if (S.profile.goal) line(`- Goal body weight: ${S.profile.goal} ${W}`);
  if (S.profile.notes) line(`- Goals and notes: ${S.profile.notes}`);
  line('- Training style: calisthenics-first upper-body strength at home (cable functional trainer, dumbbells, kettlebells, push-up board) plus a gym; rock climbing on Sundays; sessions capped at about 60 minutes.');
  const latest = bodySorted()[0];
  if (latest) {
    const parts = BODY_FIELDS.filter(f => latest[f.k] != null && f.k !== 'weight').map(f => `${f.label.toLowerCase()} ${fmtN(latest[f.k])}${f.unit === '%' ? '%' : ' ' + L}`);
    if (parts.length) line(`- Latest measurements (${fmtDate(latest.date, true)}): ${parts.join(', ')}`);
  }
  line('');
  line(`## Session: ${dayName(sess.dayId)} ${sess.title || ''}, ${LOCS[sess.loc] || sess.loc}, ${fmtDate(sess.date, true)}`);
  if (plan && plan.focus) line(`Planned focus: ${plan.focus}`);
  const meta = [sess.duration != null ? `${sess.duration} min` : '', sess.energy != null ? `energy ${sess.energy}/5 (${ENERGY[sess.energy - 1] || ''})` : '', sess.bodyweight != null ? `body weight ${fmtN(sess.bodyweight)} ${W}` : ''].filter(Boolean);
  if (meta.length) line(meta.join(' | '));
  line('');
  line('| Exercise | Target | Done today | Last time |');
  line('|---|---|---|---|');
  const planEx = plan ? plan.exercises : [];
  const names = planEx.length ? planEx.map(e => e.name) : sess.exercises.map(e => e.name);
  names.forEach(n => {
    const pe = planEx.find(e => e.name === n);
    const done = sess.exercises.find(e => norm(e.name) === norm(n));
    const type = (done && done.type) || (pe && pe.type) || 'reps';
    const target = pe ? `${pe.sets} × ${pe.reps}${type === 'time' ? ' s' : ''}` : '';
    const doneTxt = done && done.sets.length ? done.sets.map(x => fmtSet(x, type)).join(', ') : 'skipped';
    let prev = '';
    for (const s of sortedSessions()) {
      if (s.id === sess.id || s.date > sess.date) continue;
      const e = s.exercises.find(e => norm(e.name) === norm(n));
      if (e && e.sets.length) { prev = `${fmtDate(s.date)}: ${e.sets.map(x => fmtSet(x, e.type)).join(', ')}`; break; }
    }
    line(`| ${n}${pe && pe.equip ? ` (${pe.equip})` : ''} | ${target} | ${doneTxt} | ${prev || 'none'} |`);
  });
  if (sess.notes) { line(''); line(`My notes: ${sess.notes}`); }
  const since = new Date(dateOf(sess.date)); since.setDate(since.getDate() - 28);
  const recent = S.sessions.filter(s => s.id !== sess.id && s.date >= isoOf(since) && s.date <= sess.date).sort((a, b) => a.date.localeCompare(b.date));
  line('');
  line(`## The 4 weeks before this session`);
  line(`- ${recent.length} other session${recent.length === 1 ? '' : 's'} logged${recent.length ? ': ' + recent.map(s => `${fmtDate(s.date)} ${s.title || dayName(s.dayId)} (${LOCS[s.loc] || s.loc})`).join('; ') : ''}`);
  line('');
  line('## What I want from you');
  line('1. How did this session go against the targets and against last time? Call out wins and anything that slipped.');
  line('2. Concrete targets for next time for each exercise (weight, reps or hold time), based on what I actually logged.');
  line('3. Any changes to exercise choice, order, volume or rest that would serve my goals better, keeping the session under an hour.');
  line('4. Recovery, nutrition or body-composition advice that fits my numbers and goals.');
  line('Be direct. Ask me if anything important is missing.');
  return out.join('\n');
}
function copyText(text) {
  const ok = () => toast('Copied. Paste it into Claude.');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let done = false; try { done = document.execCommand('copy'); } catch (e) { /* ignore */ }
    ta.remove();
    done ? ok() : toast('Couldn’t copy. Your browser blocked the clipboard.');
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}

/* =====================================================================

const learnEl = $('#learn');
let learnOpener = null;
function openLearn(btn) {
  const scope = btn.dataset.scope;

  const ex = list.find(x => x.id === btn.dataset.ex);

  $('#learnSub').textContent = `${ex.sets} × ${ex.reps}${isTime ? ' s' : ''}`;
  const watchUrl = m.yt ? `https://www.youtube.com/watch?v=${m.yt}${m.start ? '&t=' + m.start + 's' : ''}` : '';
  let video;
  if (!m.yt) {
    video = `<div class="video"><div class="novideo"><p>No video for this exercise yet.</p><p>Add a YouTube link to it in the Plan tab.</p></div></div>`;
  } else if (location.protocol === 'file:') {
    video = `<div class="video"><div class="novideo"><p>YouTube won’t play videos in a page opened straight from a file.</p><p>Run the app on localhost or GitHub Pages to watch here, or <a href="${watchUrl}" target="_blank" rel="noopener">watch on YouTube</a>.</p></div></div>`;
  } else {
    const src = `https://www.youtube-nocookie.com/embed/${m.yt}?rel=0&playsinline=1&modestbranding=1${m.start ? '&start=' + m.start : ''}`;
    video = `<div class="video"><iframe src="${src}" title="${esc(ex.name)} demo video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`;
  }
  const credit = m.yt ? `<p class="vcredit">${m.by ? 'Video by ' + esc(m.by) + '. ' : ''}<a href="${watchUrl}" target="_blank" rel="noopener">Open on YouTube</a></p>` : '';
  const shots = m.imgs.length ? `<div class="shots">${m.imgs.map(i => `<figure><img src="${esc(i.src)}" alt="${esc(ex.name)}${i.cap ? ', ' + i.cap.toLowerCase() : ''}" loading="lazy" onerror="this.closest('figure').remove()">${i.cap ? `<figcaption>${i.cap}</figcaption>` : ''}</figure>`).join('')}</div>${m.db ? '<p class="vcredit">Photos from Free Exercise DB (public domain). They show the general movement; your equipment may differ.</p>' : ''}` : '';
  const facts = [['Equipment', ex.equip], ['Notes', ex.notes]].filter(f => f[1]);
  $('#learnBody').innerHTML = video + credit + shots +
    (facts.length ? `<dl class="facts">${facts.map(f => `<dt>${f[0]}</dt><dd>${esc(f[1])}</dd>`).join('')}</dl>` : '');
  document.documentElement.classList.add('sheet-open');
  if (typeof learnEl.showModal === 'function') learnEl.showModal(); else learnEl.setAttribute('open', '');
  learnEl.scrollTop = 0;
  const close = $('.sheet-close', learnEl); if (close) close.focus({ preventScroll: true });
}
function closeLearn() {
  if (typeof learnEl.close === 'function' && learnEl.open) learnEl.close();
  else { learnEl.removeAttribute('open'); onLearnClosed(); }
}
function onLearnClosed() {
  $('#learnBody').innerHTML = '';   /* removes the player so the video stops */
  document.documentElement.classList.remove('sheet-open');
  if (learnOpener && document.body.contains(learnOpener)) learnOpener.focus({ preventScroll: true });
  learnOpener = null;
}
learnEl.addEventListener('close', onLearnClosed);
learnEl.addEventListener('click', e => { if (e.target === learnEl) closeLearn(); });

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]');
  if (b && acts[b.dataset.act]) { e.preventDefault(); acts[b.dataset.act](b, e); }
});

main.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) {
    const row = t.closest('.set');
    const ex = exById(row.dataset.ex); if (!ex) return;
    ensureSets(ex)[Number(row.dataset.i)][t.dataset.f] = t.value;
    persist(); refreshDraftNote(); return;
  }
  if (t.dataset.s) { draft(true)[t.dataset.s] = t.value; persist(); refreshDraftNote(); return; }
  if (t.dataset.p) {
    const p = S.plan[ui.planDay][ui.planLoc];
    p[t.dataset.p] = t.dataset.p === 'minutes' ? num(t.value) : t.value; persist(); return;
  }
  if (t.dataset.pe) {
    const id = t.closest('.ped').dataset.exid;
    const x = S.plan[ui.planDay][ui.planLoc].exercises.find(e => e.id === id); if (!x) return;
    if (t.dataset.pe === 'sets') { const n = num(t.value); if (n != null && n >= 1) x.sets = Math.round(n); }
    else if (t.dataset.pe === 'group') x.group = t.value.trim().toUpperCase();
    else x[t.dataset.pe] = t.value;
    persist(); return;
  }
  if (t.dataset.prof) { S.profile[t.dataset.prof] = t.value; persist(); return; }
  if ('progress' in t.dataset) { ui.progress = t.value; $('#progressOut').innerHTML = progressTable(); }
});

main.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'loc-train') { ui.loc = t.value; S.settings.loc = t.value; persist(); render(); return; }
  if (t.name === 'loc-plan') { ui.planLoc = t.value; render(); return; }
  if (t.name === 'energy') { draft(true).energy = t.value; persist(); refreshDraftNote(); return; }
  if (t.name === 'wunit') { S.settings.w = t.value; persist(); render(); return; }
  if (t.name === 'lunit') { S.settings.l = t.value; persist(); render(); return; }
  if (t.dataset.pe === 'type') { /* select fires change, not input, in some browsers */
    const id = t.closest('.ped').dataset.exid;
    const x = S.plan[ui.planDay][ui.planLoc].exercises.find(ex => ex.id === id); if (x) { x.type = t.value; persist(); }
  }
  if (t.dataset.prof || t.dataset.p || t.dataset.pe || t.dataset.s) persist(true);
});

main.addEventListener('submit', e => {
  if (e.target.id !== 'bodyForm') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const date = fd.get('date') || todayISO();
  const vals = {};
  BODY_FIELDS.forEach(f => { const v = num(fd.get(f.k)); if (v != null) vals[f.k] = v; });
  const notes = String(fd.get('notes') || '').trim();
  if (!Object.keys(vals).length && !notes) { toast('Enter at least one measurement.'); return; }
  const existing = S.body.find(x => x.date === date);
  if (existing) { Object.assign(existing, vals); if (notes) existing.notes = notes; }
  else S.body.push(Object.assign({ id: uid(), date, notes }, vals));
  persist(true); render(); toast(existing ? 'Measurements updated for ' + fmtDate(date) : 'Measurements saved');
});

$('#importFile').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (err) { toast('That file isn’t valid JSON.'); return; }
    if (!data || typeof data !== 'object' || !data.plan || !Array.isArray(data.sessions)) { toast('That file isn’t a workout backup.'); return; }
    if (!confirm(`Replace everything on this device with this backup (${data.sessions.length} sessions, ${(data.body || []).length} body entries)?`)) return;
    delete data.exportedAt;
    S = migrate(data); persist(true);
    ui.loc = S.settings.loc || 'home'; ui.planLoc = ui.loc;
    render(); toast('Backup imported');
  };
  reader.readAsText(file);
});

window.addEventListener('pagehide', () => persist(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persist(true); });
setInterval(() => { const el = $('#timerVal'); const d = draft(false); if (el && d && d.startedAt) el.innerHTML = timerText(d); }, 30000);

/* =====================================================================
   Lock screen
   ===================================================================== */
const lockEl = $('#lock'), appEl = $('#app'), pinMsg = $('#pinMsg');
let pin = '';
let checking = false;
function drawPlates() {
  $$('.plate', lockEl).forEach(p => p.classList.toggle('on', Number(p.dataset.slot) < pin.length));
  if (!checking) {
    pinMsg.classList.remove('bad');
    pinMsg.textContent = pin.length ? `${pin.length} of 4 digits` : 'Four digits loads the bar.';
  }
}
function pinKey(k) {
  if (checking) return;
  if (k === 'back') { pin = pin.slice(0, -1); drawPlates(); return; }
  if (!/^\d$/.test(k) || pin.length >= 4) return;
  pin += k; drawPlates();
  if (pin.length === 4) { checking = true; setTimeout(checkPin, 160); }
}
function reducedMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function checkPin() {
  if (sha256(pin) === PIN_HASH) {
    try { sessionStorage.setItem(UNLOCK_KEY, '1'); } catch (e) { /* ignore */ }
    pinMsg.textContent = 'Unlocked';
    lockEl.classList.add('lifted');
    setTimeout(showApp, reducedMotion() ? 0 : 480);
  } else {
    pinMsg.textContent = 'That PIN didn’t match. Try again.';
    pinMsg.classList.add('bad');
    lockEl.classList.add('shake');
    setTimeout(() => { lockEl.classList.remove('shake'); pin = ''; checking = false; drawPlates(); pinMsg.textContent = 'That PIN didn’t match. Try again.'; pinMsg.classList.add('bad'); }, 420);
  }
}
lockEl.addEventListener('click', e => { const k = e.target.closest('[data-k]'); if (k) pinKey(k.dataset.k); });
document.addEventListener('keydown', e => {
  if (lockEl.hidden) return;
  if (/^\d$/.test(e.key)) { pinKey(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { pinKey('back'); e.preventDefault(); }
});
function showLock() {
  if (learnEl.open) closeLearn();
  pin = ''; checking = false;
  lockEl.classList.remove('lifted', 'shake');
  main.innerHTML = '';
  appEl.hidden = true; lockEl.hidden = false;
  drawPlates();
}
function showApp() {
  checking = false;
  lockEl.hidden = true; appEl.hidden = false;
  render();
}

let unlocked = false;
try { unlocked = sessionStorage.getItem(UNLOCK_KEY) === '1'; } catch (e) { /* ignore */ }
if (unlocked) showApp(); else showLock();

})();
</script>
</body>
</html>
