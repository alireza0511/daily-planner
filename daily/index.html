<style>
  :root { --bg: #f6f3ee; --card: #fff; --ink: #1f2329; --muted: #6b7280; --line: #e7e2d9; --accent: #0f766e; --bad: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171c; --card: #1d2128; --ink: #e8eaed; --muted: #9aa1ab; --line: #2c323b; --accent: #2dd4bf; --bad: #f87171; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px 22px; text-align: center; }
  .ico { font-size: 40px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  .pw { position: relative; }
  input { width: 100%; font: inherit; font-size: 17px; padding: 12px 44px 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: inherit; outline: none; }
  input:focus { border-color: var(--accent); }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; font-size: 18px; padding: 6px; cursor: pointer; color: var(--muted); }
  button.go { margin-top: 12px; width: 100%; font: inherit; font-weight: 650; font-size: 16px; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; }
  button.go:disabled { opacity: .6; }
  .msg { min-height: 22px; margin-top: 12px; font-size: 14px; color: var(--bad); }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
</style>

</form>

<script>
(() => {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const DATA_SALT_KEY = "dailyplanner.salt";
  const f = document.getElementById("f"), pw = document.getElementById("pw"), msg = document.getElementById("msg"), go = document.getElementById("go");
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  let fails = 0, busy = false;

  if (!window.crypto || !crypto.subtle) { msg.textContent = "Open this page over https:// to unlock."; go.disabled = true; }
  document.getElementById("eye").onclick = () => { pw.type = pw.type === "password" ? "text" : "password"; pw.focus(); };

  async function derive(pass, salt, iter, usages) {
    const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, usages);
  }
  function dataSalt() {
    let s = null;
    try { s = localStorage.getItem(DATA_SALT_KEY); } catch (e) {}
    if (s) return b64(s);
    const u = crypto.getRandomValues(new Uint8Array(16));
    try { localStorage.setItem(DATA_SALT_KEY, btoa(String.fromCharCode(...u))); } catch (e) {}
    return u;
  }

  // Offline support + installable app (only runs on https or localhost).
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  f.addEventListener("submit", async e => {
    e.preventDefault();
    if (busy || !pw.value) return;
    busy = true; go.disabled = true; msg.textContent = ""; go.textContent = "Unlocking…";
    const pass = pw.value;
    try {
      const pageKey = await derive(pass, b64(P.salt), P.iter, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, pageKey, b64(P.ct));
      // Separate key, never extractable, used by the planner to encrypt what you type.
      window.__dpKey = await derive(pass, dataSalt(), P.iter, ["encrypt", "decrypt"]);
      pw.value = "";
      const html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    } catch (err) {
      fails++;
      msg.textContent = "Wrong password.";
      f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
      // Small growing delay after repeated misses.
      setTimeout(() => { busy = false; go.disabled = false; go.textContent = "Unlock"; pw.select(); }, Math.min(8000, 300 * 2 ** Math.max(0, fails - 2)));
    }
  });
})();
</script>
